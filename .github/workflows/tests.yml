name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check dependency consistency
        run: |
          python -m pip check

      - name: Run unit test suite
        run: |
          python -m unittest discover -s tests -v

  container:
    name: Container Build & Runtime Smoke Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Docker image with lean runtime dependencies
        run: |
          docker build -t alternative-credit-scoring-api:ci-test .

      - name: Verify development-only packages are absent from container
        run: |
          echo "Checking Streamlit absence..."
          docker run --rm alternative-credit-scoring-api:ci-test python -c "import streamlit" 2>&1 && exit 1 || echo "Streamlit is absent as expected."
          echo "Checking Matplotlib absence..."
          docker run --rm alternative-credit-scoring-api:ci-test python -c "import matplotlib" 2>&1 && exit 1 || echo "Matplotlib is absent as expected."

      - name: Test model artifact integrity failure on temporary container
        run: |
          echo "tampered_compromised_artifact" > /tmp/corrupted_model.joblib
          docker run -d \
            --name test-corrupted-container \
            -v /tmp/corrupted_model.joblib:/app/models/hybrid_logistic_regression.joblib:ro \
            -p 127.0.0.1:18766:8000 \
            alternative-credit-scoring-api:ci-test
          python scripts/test_container_runtime.py --port 18766 --test-integrity-failure

      - name: Stop and clean up temporary corrupted container
        if: always()
        run: |
          docker stop test-corrupted-container || true
          docker rm -f test-corrupted-container || true

      - name: Run healthy container
        run: |
          docker run -d \
            --name test-api-container \
            --health-interval=2s \
            --health-timeout=2s \
            --health-retries=5 \
            --health-start-period=1s \
            -p 127.0.0.1:18765:8000 \
            alternative-credit-scoring-api:ci-test

      - name: Run container runtime smoke tests
        run: |
          python scripts/test_container_runtime.py --port 18765 --container-name test-api-container

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker logs test-api-container || true

      - name: Stop and remove container
        if: always()
        run: |
          docker stop test-api-container || true
          docker rm -f test-api-container || true
